
name: Build and deploy Next.js SSR to Azure Web App - devjobsui

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install dependencies & build
        run: |
          npm ci
          npm run build

      - name: Transpile next.config.ts
        run: |
          npm install --save-dev @babel/core @babel/cli @babel/preset-typescript
          echo '{ "presets": ["@babel/preset-typescript"] }' > babel.config.json
          npx babel next.config.ts --out-file next.config.js

      - name: Prepare deployment package
        run: |
          mkdir deploy
          cp -r .next public package.json next.config.js deploy/
          cp -r node_modules deploy/
          if [ -f ecosystem.config.js ]; then cp ecosystem.config.js deploy/; fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-app
          path: deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2FDC05F631FD49068920C950142405C7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_EDF16FC710B5444689573310278C1FA4 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_51F9F2589F9E4C1799F768C40E4D4425 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'devjobsui'
          slot-name: 'Production'
          package: .
